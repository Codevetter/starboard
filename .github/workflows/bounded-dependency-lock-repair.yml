name: Temporary dependency lock repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate-lock:
    if: github.head_ref == 'agent/starboard60-bounded-audit-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: starboard60-lock-${{ github.event.pull_request.head.sha }}
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
