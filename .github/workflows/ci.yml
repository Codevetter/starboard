name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality

      - run: node --test scripts/public-readability.test.mjs scripts/markdown-canonical-boundary.test.mjs

      - run: pnpm build:e2e

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results
