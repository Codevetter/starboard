name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Matches the locked Playwright 1.62.0; includes all three browsers and OS libraries.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6

      - name: Trust the checked-out workspace in the job container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality

      - run: node --test scripts/public-readability.test.mjs scripts/markdown-canonical-boundary.test.mjs

      - run: pnpm build:e2e

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results
