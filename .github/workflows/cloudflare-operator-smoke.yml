name: Cloudflare operator smoke

on:
  workflow_dispatch:
    inputs:
      embed_limit:
        description: 'Optional guarded embedding smoke (0 disables; maximum 100)'
        required: false
        default: '0'

concurrency:
  group: cloudflare-operator-smoke
  cancel-in-progress: true

jobs:
  verify-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Require operator token before remote work
        run: node scripts/check-operator-token.mjs
        env:
          STARBOARD_OPERATOR_TOKEN: ${{ secrets.STARBOARD_OPERATOR_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify D1 access
        run: pnpm exec wrangler d1 info starboard --json > /dev/null
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify Worker D1 and Vectorize bindings
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30
          --header "Authorization: Bearer ${STARBOARD_OPERATOR_TOKEN}"
          https://starboard.codevetter.com/api/internal/embed-pending > /dev/null
        env:
          STARBOARD_OPERATOR_TOKEN: ${{ secrets.STARBOARD_OPERATOR_TOKEN }}

      - name: Verify guarded embedding admission when requested
        run: node scripts/smoke-embedding-admission.mjs
        env:
          STARBOARD_OPERATOR_TOKEN: ${{ secrets.STARBOARD_OPERATOR_TOKEN }}
          EMBED_LIMIT: ${{ inputs.embed_limit }}
