name: Deploy to Cloudflare Workers
# Rollback: `wrangler versions rollback` from the repo root, or via
# dash.cloudflare.com → Workers → starboard → Versions → "Rollback".
on:
  workflow_dispatch:
    inputs:
      purge_cache:
        description: Purge starboard.codevetter.com after deployment
        required: true
        default: true
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # populateCache local boots an in-memory wrangler platform proxy to
      # resolve bindings; AI + the unsafe rate-limiter binding need the
      # same CF token the wrangler-action below uses, otherwise the step
      # errors with "You must be logged in to use wrangler dev in remote
      # mode."
      - run: pnpm cf:build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --tag ${{ github.sha }}
      - name: Purge Starboard cache
        if: ${{ inputs.purge_cache }}
        run: node scripts/purge-cloudflare-cache.mjs
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: c1e6464302240c22f727ce64262136fe
          CLOUDFLARE_CACHE_HOSTNAME: starboard.codevetter.com
      - name: Smoke check production
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 https://starboard.codevetter.com/ > /dev/null
