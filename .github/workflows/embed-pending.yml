name: Embed pending repos

on:
  workflow_dispatch:
    inputs:
      embed_limit:
        description: 'Embeddings to generate this run'
        required: false
        default: '3000'

concurrency:
  group: starboard-embedding
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Embed pending repos
        shell: bash
        run: |
          request_file="$RUNNER_TEMP/embed-pending-request.json"
          response_file="$RUNNER_TEMP/embed-pending-response.json"
          node -e 'process.stdout.write(JSON.stringify({ limit: Number(process.argv[1]) }))' \
            "$EMBED_LIMIT" > "$request_file"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 900 --request POST \
            --header "Authorization: Bearer ${AI_GATEWAY_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request_file" \
            --output "$response_file" \
            https://starboard.codevetter.com/api/internal/embed-pending
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(`Embedded ${r.embedded}; ${r.remaining} remaining`)' \
            "$response_file"
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          EMBED_LIMIT: ${{ github.event.inputs.embed_limit || '3000' }}
