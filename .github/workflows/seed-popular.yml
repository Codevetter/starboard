name: Seed popular repos

on:
  schedule:
    # Weekly, away from the top-of-hour GitHub Actions load spike.
    - cron: '17 3 * * 0' # 03:17 UTC every Sunday
  workflow_dispatch:
    inputs:
      daily_limit:
        description: 'Embeddings to generate this run'
        required: false
        default: '1000'
      tool_enrich_limit:
        description: 'Repos to inspect for tool intelligence'
        required: false
        default: '250'
      max_additions:
        description: 'Abort-before-write repository addition bound (0-200)'
        required: false
        default: '200'

concurrency:
  group: starboard-embedding
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run seed script
        run: pnpm db:seed-popular
        env:
          # The runner token has enough GitHub Search quota for one complete,
          # rate-paced catalog reconciliation.
          # Keep this independent of long-lived PAT rotation so a stale secret
          # cannot break a scheduled seed run with 401 Bad credentials.
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_EMBED_MODE: 'worker'
          # Fail before repository writes when the source delta is anomalous.
          SEED_MAX_ADDITIONS: ${{ github.event.inputs.max_additions || '200' }}
          SEED_MIN_SOURCE_REPOS: '5000'
          MIN_STARS_FLOOR: '5000'

      - name: Embed refreshed repos through Worker bindings
        shell: bash
        run: |
          request_file="$RUNNER_TEMP/seed-embedding-request.json"
          response_file="$RUNNER_TEMP/seed-embedding-response.json"
          node -e 'process.stdout.write(JSON.stringify({ limit: Number(process.argv[1]) }))' \
            "$EMBED_LIMIT" > "$request_file"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 900 --request POST \
            --header "Authorization: Bearer ${AI_GATEWAY_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request_file" \
            --output "$response_file" \
            https://starboard.codevetter.com/api/internal/embed-pending
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(`Embedded ${r.embedded}; ${r.remaining} remaining`)' \
            "$response_file"
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          EMBED_LIMIT: ${{ github.event.inputs.daily_limit || '1000' }}

      - name: Publish refresh evidence
        if: always()
        shell: bash
        run: |
          if [[ -f data/refresh-manifest.json ]]; then
            {
              echo '### Refresh manifest'
              echo '```json'
              cat data/refresh-manifest.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Refresh manifest' >> "$GITHUB_STEP_SUMMARY"
            echo 'No manifest was produced; refresh evidence is missing.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enrich tool intelligence
        run: pnpm db:enrich-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOOL_ENRICH_LIMIT: ${{ github.event.inputs.tool_enrich_limit || '250' }}
          TOOL_ENRICH_HARD_LIMIT: '750'
          TOOL_MIN_STARS: '10000'

  # A scheduled run has no human watching it, so a failure is otherwise only
  # visible in Actions history or a notification email. Keep one open tracking
  # issue that reflects the current health of the scheduled seed.
  alert:
    needs: seed
    # Cancelled and skipped runs are not health signals, so they neither open
    # nor close the tracking issue.
    if: >-
      always() && github.event_name == 'schedule'
      && (needs.seed.result == 'success' || needs.seed.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_LABEL: scheduled-job-failure
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SEED_RESULT: ${{ needs.seed.result }}
    steps:
      - name: Ensure the alert label exists
        run: |
          gh label create "$ALERT_LABEL" \
            --color B60205 \
            --description 'A scheduled workflow run failed' >/dev/null 2>&1 || true

      - name: Reconcile the scheduled-seed health issue
        run: |
          set -euo pipefail
          open_issue="$(gh issue list --label "$ALERT_LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty')"

          if [[ "$SEED_RESULT" == 'success' ]]; then
            if [[ -n "$open_issue" ]]; then
              gh issue close "$open_issue" \
                --comment "Scheduled seed recovered: [run]($RUN_URL) completed successfully."
              echo "Closed alert #$open_issue after recovery."
            else
              echo 'Scheduled seed succeeded; no open alert to close.'
            fi
            exit 0
          fi

          body="The scheduled \`Seed popular repos\` run finished with result \`$SEED_RESULT\`.

          - Failing run: $RUN_URL
          - Job steps: migrations → \`db:seed-popular\` → Worker embedding → \`db:enrich-tools\`

          This issue closes automatically when the next scheduled run succeeds."

          if [[ -n "$open_issue" ]]; then
            gh issue comment "$open_issue" --body "$body"
            echo "Commented on existing alert #$open_issue."
          else
            created="$(gh issue create \
              --title 'Scheduled seed run failed' \
              --label "$ALERT_LABEL" \
              --body "$body")"
            echo "Opened alert $created."
            # Assignment is best-effort: an alert must never be lost because the
            # owner handle is not assignable from this token.
            gh issue edit "$created" --add-assignee sarthakagrawal927 >/dev/null 2>&1 || true
          fi
