packages:
  - "."
  - "landing-astro"

# Pin packages that were published in the last 24h so the
# supply-chain policy on `pnpm install --frozen-lockfile` doesn't
# reject the lockfile. Bump these as they age past the cutoff.
overrides:
  "@vercel/routing-utils@5.3.3>path-to-regexp": 6.3.0
  "ajv@8.20.0>fast-uri": 3.1.5
  "cosmiconfig@9.0.2>js-yaml": 4.3.1
  "gray-matter@4.0.3>js-yaml": 3.15.1
  "minimatch@5.1.9>brace-expansion": 2.1.4
  "minimatch@8.0.7>brace-expansion": 2.1.4
  "minimatch@10.2.5>brace-expansion": 5.0.9
  nanoid: 3.3.18
  rollup: 4.60.2
  wrangler: 4.120.0
